spring:
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    user:
      name: admin
      password: 123456
  datasource:
    url: jdbc:h2:file:./data/testdb1;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cache:
    type: simple
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      base-url: https://api.githubcopilot.com
      chat:
        options:
          model: gpt-4o
        completions-path: /chat/completions
      embedding:
        options:
          model: text-embedding-3-small
        embeddings-path: /embeddings
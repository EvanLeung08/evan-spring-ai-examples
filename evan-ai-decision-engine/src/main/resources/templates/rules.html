<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Routing Rules</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/rules.js}" src="../js/rules.js"></script>
</head>
<body>
<div class="container mt-4">
    <h2>Routing Rules</h2>
    <button class="btn btn-primary mb-2" data-bs-toggle="modal" data-bs-target="#ruleModal">Add Rule</button>
    <table class="table table-bordered" id="rulesTable">
        <thead>
        <tr>
            <th>Name</th><th>Condition</th><th>Expression</th><th>Tool</th><th>Priority</th><th>Status</th><th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- Table rows will be dynamically loaded by JS -->
        </tbody>
    </table>
</div>
<div class="modal fade" id="ruleModal" tabindex="-1" aria-labelledby="ruleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <form id="ruleForm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="ruleModalLabel">Add/Edit Rule</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" name="id" id="ruleId">
                    <div class="mb-2">
                        <label>Name</label>
                        <input type="text" class="form-control" name="name" id="ruleName" required placeholder="e.g. Text Classification">
                    </div>
                    <div class="mb-2">
                        <label>Condition</label>
                        <select class="form-control" name="condition" id="ruleCondition" required>
                            <option value="KEYWORD">KEYWORD</option>
                            <option value="REGEX">REGEX</option>
                            <option value="AI">AI</option>
                        </select>
                        <small class="form-text text-muted">e.g. KEYWORD / REGEX / AI</small>
                    </div>
                    <div class="mb-2">
                        <label>Expression</label>
                        <input type="text" class="form-control" name="expression" id="ruleExpression" required placeholder="e.g. invoice|receipt or ^order-\d+$">
                    </div>
                    <div class="mb-2">
                        <label>Tool Type</label>
                        <select class="form-control" name="toolType" id="ruleToolType" required>
                            <option value="MCP">MCP</option>
                            <option value="API">API</option>
                        </select>
                        <small class="form-text text-muted">e.g. MCP / API</small>
                    </div>
                    <div class="mb-2">
                        <label>Tool Config (JSON)</label>
                        <input type="text" class="form-control" name="toolConfig" id="ruleToolConfig" required placeholder='e.g. {"endpoint":"/api/classify","method":"POST"}'>
                    </div>
                    <div class="mb-2">
                        <label>Priority</label>
                        <input type="number" class="form-control" name="priority" id="rulePriority" min="1" max="100" required placeholder="e.g. 10">
                    </div>
                    <div class="mb-2">
                        <label>Tool Script (Groovy)</label>
                        <textarea class="form-control" name="toolScript" id="ruleToolScript" rows="6" placeholder="def call(request, config) { ... }"></textarea>
                        <small class="form-text text-muted">Optional: Custom Groovy script for tool execution</small>
                    </div>
                    <div class="mb-2">
                        <label>Enabled</label>
                        <input type="checkbox" name="enabled" id="ruleEnabled">
                        <small class="form-text text-muted">Check to enable this rule</small>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                </div>
            </div>
        </form>
    </div>
</div>

<div class="modal fade" id="scriptModal" tabindex="-1" aria-labelledby="scriptModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="scriptModalLabel">Tool Script</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <pre id="scriptContent" style="white-space: pre-wrap; word-break: break-all;"></pre>
            </div>
        </div>
    </div>
</div>
</body>
</html>

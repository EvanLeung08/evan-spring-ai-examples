<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI Decision Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .chat-container { max-width: 600px; margin: 40px auto; }
        .chat-box { background: #f8f9fa; border-radius: 8px; padding: 20px; min-height: 400px; }
        .chat-message { margin-bottom: 16px; }
        .chat-user { font-weight: bold; color: #0d6efd; }
        .chat-ai { font-weight: bold; color: #198754; }
        .chat-bubble {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 16px;
            background: #e9ecef;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            max-width: 80%;
            box-sizing: border-box;
            vertical-align: top;
        }
        .chat-bubble.ai {
            background: #d1e7dd;
        }
        .typing { font-style: italic; color: #888; }
    </style>
</head>
<body>
<div class="container chat-container">
    <h2>AI Decision Chat</h2>
    <div class="chat-box" id="chatBox"></div>
    <form id="chatForm" class="mt-3 d-flex">
        <input type="text" class="form-control me-2" id="userInput" placeholder="Type your request..."
               autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>

<!-- Application Scripts -->
<script th:src="@{/js/chat.js}" src="../js/chat.js"></script>

</body>
</html>

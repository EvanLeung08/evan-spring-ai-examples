<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>AI Decision Chat</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .chat-container { max-width: 600px; margin: 40px auto; }
        .chat-box { background: #f8f9fa; border-radius: 8px; padding: 20px; min-height: 400px; }
        .chat-message { margin-bottom: 16px; }
        .chat-user { font-weight: bold; color: #0d6efd; }
        .chat-ai { font-weight: bold; color: #198754; }
        .chat-bubble {
            display: inline-block;
            padding: 10px 16px;
            border-radius: 16px;
            background: #e9ecef;
            word-break: break-word;
            overflow-wrap: break-word;
            white-space: pre-wrap;
            max-width: 80%;
            box-sizing: border-box;
            vertical-align: top;
        }
        .chat-bubble.ai {
            background: #d1e7dd;
        }
        .typing { font-style: italic; color: #888; }
    </style>
</head>
<body>
<div class="container chat-container">
    <h2>AI Decision Chat</h2>
    <div class="chat-box" id="chatBox"></div>
    <form id="chatForm" class="mt-3 d-flex">
        <input type="text" class="form-control me-2" id="userInput" placeholder="Type your request..."
               autocomplete="off" required>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>
<script>
    function appendMessage(sender, text, isAI) {
        let bubbleClass = isAI ? "chat-bubble ai" : "chat-bubble";
        let senderClass = isAI ? "chat-ai" : "chat-user";
        let html = `<div class="chat-message">
            <span class="${senderClass}">${sender}:</span>
            <span class="${bubbleClass}" id="msg-${Date.now()}">${text}</span>
        </div>`;
        $("#chatBox").append(html);
        $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);
    }

    let lastAIMessageId = null;
    let lastAIText = "";

   $("#chatForm").submit(function(e) {
    e.preventDefault();
    let input = $("#userInput").val();
    if (!input.trim()) return;
    appendMessage("You", input, false);
    $("#userInput").val("");
    // Add AI typing indicator
    let typingId = "typing-" + Date.now();
    $("#chatBox").append(`<div class="chat-message typing" id="${typingId}">AI is typing...</div>`);
    $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);

    // Start SSE stream
    let aiMsgId = "ai-msg-" + Date.now();
    lastAIMessageId = aiMsgId;
    lastAIText = "";
    // Only append the AI message bubble ONCE
    $("#chatBox").append(`<div class="chat-message"><span class="chat-ai">AI:</span> <span class="chat-bubble ai" id="${aiMsgId}"></span></div>`);
    $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);

    let source = new EventSourcePolyfill("/api/rules/chat/sse?request=" + encodeURIComponent(input));
    source.onmessage = function(event) {
        // Only update the text, do not re-append or change display
        $("#" + aiMsgId).text(event.data);
        $("#chatBox").scrollTop($("#chatBox")[0].scrollHeight);
    };
    source.onerror = function() {
        $("#" + typingId).remove();
        source.close();
    };
    source.onopen = function() {
        $("#" + typingId).remove();
    };
});

    // 兼容POST SSE（EventSource 只支持GET），用 polyfill
   function EventSourcePolyfill(url) {
    let controller = new AbortController();
    let listeners = {};
    fetch(url.replace("/chat/sse", "/chat"), {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({request: decodeURIComponent(url.split("=")[1])}),
        signal: controller.signal
    }).then(resp => {
        const reader = resp.body.getReader();
        let buffer = ""; // Buffer for incomplete lines
        function read() {
            reader.read().then(({done, value}) => {
                if (done) {
                    if (listeners.onerror) listeners.onerror();
                    return;
                }
                let chunk = new TextDecoder().decode(value);
                buffer += chunk;
                let lines = buffer.split("\n");
                buffer = lines.pop(); // Save incomplete line
                lines.forEach(line => {
                    if (line.startsWith("data:")) {
                        if (listeners.onmessage) listeners.onmessage({data: line.substring(5).trim()});
                    }
                });
                read();
            });
        }
        if (listeners.onopen) listeners.onopen();
        read();
    }).catch(() => {
        if (listeners.onerror) listeners.onerror();
    });
    this.onmessage = null;
    this.onerror = null;
    this.onopen = null;
    this.close = () => controller.abort();
    Object.defineProperty(this, "onmessage", {
        set: fn => listeners.onmessage = fn
    });
    Object.defineProperty(this, "onerror", {
        set: fn => listeners.onerror = fn
    });
    Object.defineProperty(this, "onopen", {
        set: fn => listeners.onopen = fn
    });
}
</script>
</body>
</html>

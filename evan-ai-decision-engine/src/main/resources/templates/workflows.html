<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workflow Management</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/monokai.min.css">
    <style>
        .CodeMirror {
            border: 1px solid #ddd;
            height: auto;
        }
        #workflowDiagram {
            width: 100%;
            height: 500px;
            border: 1px solid #ddd;
            background-color: #f8f9fa;
            margin-bottom: 20px;
        }
        #nodeEditor {
            display: none;
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 20px;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row mb-3">
        <div class="col">
            <nav class="navbar navbar-expand-lg navbar-light bg-light">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">Decision Engine</a>
                    <div class="collapse navbar-collapse">
                        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                            <li class="nav-item">
                                <a class="nav-link" href="/rules">Rules</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link active" href="/workflows">Workflows</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="/chat">Chat</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </div>

    <!-- Workflow List View -->
    <div id="workflowsList">
        <div class="row mb-3">
            <div class="col">
                <h2>Workflows</h2>
                <button id="createWorkflowBtn" class="btn btn-primary mb-3">Create Workflow</button>
            </div>
        </div>
        <div class="row">
            <div class="col">
                <table id="workflowsTable" class="table table-striped">
                    <thead>
                    <tr>
                        <th>Name</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                    </thead>
                    <tbody id="workflowsTableBody">
                    <!-- Workflows will be loaded here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Workflow Designer View -->
    <div id="workflowDesigner" style="display: none;">
        <div class="row mb-3">
            <div class="col">
                <h2>Workflow Designer</h2>
                <button id="listWorkflowsBtn" class="btn btn-secondary mb-3">Back to List</button>
            </div>
        </div>

        <!-- Workflow Properties -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Workflow Properties</div>
                    <div class="card-body">
                        <input type="hidden" id="workflowId">
                        <div class="mb-3">
                            <label for="workflowName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="workflowName">
                        </div>
                        <div class="mb-3">
                            <label for="workflowDescription" class="form-label">Description</label>
                            <textarea class="form-control" id="workflowDescription" rows="2"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" id="workflowEnabled" checked>
                            <label class="form-check-label" for="workflowEnabled">Enabled</label>
                        </div>
                        <button id="saveWorkflowBtn" class="btn btn-primary">Save Workflow</button>
                        <button id="testWorkflowBtn" class="btn btn-info">Test Workflow</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Workflow Diagram -->
        <div class="row mb-3">
            <div class="col">
                <h4>Workflow Diagram</h4>
                <div id="workflowDiagram"></div>
                <button id="addNodeBtn" class="btn btn-success">Add Node</button>
            </div>
        </div>

        <!-- Node Editor -->
        <div id="nodeEditor" class="row">
            <div class="col">
                <h4>Node Properties</h4>
                <form id="nodeForm">
                    <input type="hidden" id="nodeId">
                    <div class="row mb-3">
                        <div class="col-md-6">
                            <label for="nodeName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="nodeName" required>
                        </div>
                        <div class="col-md-3">
                            <label for="nodePosition" class="form-label">Position</label>
                            <input type="number" class="form-control" id="nodePosition" min="1" required>
                        </div>
                        <div class="col-md-3">
                            <label for="nodeToolType" class="form-label">Tool Type</label>
                            <select class="form-select" id="nodeToolType">
                                <option value="API">API</option>
                                <option value="MCP">MCP</option>
                            </select>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="nodeToolConfig" class="form-label">Tool Configuration</label>
                        <div class="d-flex justify-content-end mb-1">
                            <button type="button" id="formatNodeConfigBtn" class="btn btn-sm btn-outline-secondary">Format JSON</button>
                        </div>
                        <textarea class="form-control" id="nodeToolConfig" rows="5"></textarea>
                    </div>
                    <div class="mb-3">
                        <label for="nodeToolScript" class="form-label">Tool Script (Groovy)</label>
                        <textarea class="form-control" id="nodeToolScript" rows="8"></textarea>
                    </div>
                    <div class="d-flex justify-content-between">
                        <div>
                            <button type="submit" class="btn btn-primary">Save Node</button>
                            <button type="button" id="cancelNodeBtn" class="btn btn-secondary">Cancel</button>
                        </div>
                        <button type="button" id="deleteNodeBtn" class="btn btn-danger">Delete Node</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Test Workflow Modal -->
    <div class="modal fade" id="testWorkflowModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Test Workflow</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="testInput" class="form-label">Input Request</label>
                        <textarea class="form-control" id="testInput" rows="3" placeholder="Enter test input..."></textarea>
                    </div>
                    <div id="testResultContainer" style="display: none;">
                        <label class="form-label">Result</label>
                        <pre id="testResult" class="p-3 bg-light border rounded"></pre>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                    <button type="button" id="runTestBtn" class="btn btn-primary">Run Test</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- JavaScript Dependencies -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/javascript/javascript.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/groovy/groovy.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.0/beautify.min.js"></script>

<!-- JointJS for diagram -->
<!-- JointJS for diagram (fixed order) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.21/lodash.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/backbone.js/1.4.0/backbone-min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.5.5/joint.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jointjs/3.5.5/joint.min.css">
<!-- Application Scripts -->
<script th:src="@{/js/workflow.js}" src="../js/workflow.js"></script>
</body>
</html>
